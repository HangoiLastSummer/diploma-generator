  questions: разработать веб-приложение для учёта сдачи лабораторных работ, включающее личные кабинеты студента и преподавателя, журнал и отчёты
  extra: расчёт себестоимости от внедрения результатов

annotation:
  ru: |
    В работе разработано веб-приложение LabTrack для учёта сдачи лабораторных работ. Приложение
    построено на ASP.NET Core и PostgreSQL, поддерживает роли студента и преподавателя, ведёт журнал
    сдачи и формирует отчёты по группам. Применение системы сокращает время на сверку ведомостей
    и исключает потерю сведений о сданных работах.
  en: |
    The thesis presents LabTrack, a web application for tracking laboratory work submissions. It is built
    on ASP.NET Core and PostgreSQL, supports student and teacher roles, keeps a submission log and produces
    group reports. The system reduces the time spent reconciling records and prevents loss of submission data.

