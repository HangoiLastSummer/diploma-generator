[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vkr"
version = "0.1.0"
description = "Генератор ВКР (.docx) по требованиям кафедры ПОВТ ПГУ им. Т.Г. Шевченко из Markdown + YAML"
requires-python = ">=3.10"
dependencies = ["python-docx>=1.1", "pyyaml>=6", "pymupdf>=1.24", "pillow>=10", "lxml>=5", "pytrovich>=0.2"]

[project.scripts]
vkr = "vkr.cli:main"

[tool.setuptools]
packages = ["vkr"]

[tool.setuptools.package-data]
vkr = ["profiles/*.yaml", "docs/*.md", "docs/claude/*.json", "docs/claude/commands/*.md"]
